---
- name: Bootstrap Deployer User
  hosts: all
  remote_user: root
  gather_facts: no  # Speed up execution, we don't need facts for this

  tasks:
    - name: Create 'deployer' user with bash shell and add to sudo group
      user:
        name: deployer
        shell: /bin/bash
        groups: sudo
        append: yes
        state: present
        create_home: yes

    - name: Create .ssh directory for deployer
      file:
        path: /home/deployer/.ssh
        state: directory
        owner: deployer
        group: deployer
        mode: '0700'

    - name: Copy authorized_keys from root to deployer
      copy:
        src: /root/.ssh/authorized_keys
        dest: /home/deployer/.ssh/authorized_keys
        remote_src: yes
        owner: deployer
        group: deployer
        mode: '0600'

    - name: Allow 'deployer' to use sudo without a password
      copy:
        content: "deployer ALL=(ALL) NOPASSWD:ALL"
        dest: /etc/sudoers.d/deployer
        mode: '0440'
        validate: 'visudo -cf %s'