- name: Copy Inception folder to the VM
  copy:
    src: ./Inception
    dest: "/home/{{ ansible_user }}/"
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Generate .env file
  template:
    src: .env.j2
    dest: "/home/{{ ansible_user }}/Inception/srcs/.env"

- name: Create data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "/home/{{ ansible_user }}/data"
    - "/home/{{ ansible_user }}/data/mysql"
    - "/home/{{ ansible_user }}/data/wordpress"
